<h1>3D Environment</h1>
<p class="lede">A studio for a small clothing brand, modeled in Blender. A tall divider splits the room in two: a physical and print side for making garments, and a digital and listing side for photographing, editing and selling them online.</p>
<figure><img src="images/env-final.jpg" alt="Wide view of the studio: a print area with a garment rack on the left and a computer desk area on the right, split by a divider">
<figcaption>Final wide view. Overhead light bars and large factory windows light both zones, and the Hotel Clock sign marks the back wall.</figcaption></figure>
<h2>Close-ups</h2>
<div class="grid">
<figure><img src="images/env-detail-3.jpg" alt="Print table with a teal mat, small stacked items and a shelving unit behind it"><figcaption>Physical and print side. A garment rack in the foreground, a work table with a cutting mat, and shelves of stock behind.</figcaption></figure>
<figure><img src="images/env-detail-2.jpg" alt="Desk with two monitors, an office chair, and a shelf of orange boxes"><figcaption>Digital and listing side. Two monitors on a long desk, with shipping boxes shelved within reach.</figcaption></figure>
<figure><img src="images/env-detail-1.jpg" alt="Close view of two monitors and a keyboard on an orange desk"><figcaption>Desk detail. Warm orange tabletop against the dark wall to make the screens stand out.</figcaption></figure>
