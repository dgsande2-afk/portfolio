<h1>Album cover</h1>
<p class="lede">A cover for Kid Cudi's Soundtrack 2 My Life, built around a rainy night ride. City lights blur through a wet window and light flares streak across the frame, so the cover feels like a late drive with headphones on.</p>
<figure><img src="images/album-final.jpg" alt="Album cover for Kid Cudi, Soundtrack 2 My Life: a rainy car window at night with colorful light flares over blurred city lights">
<figcaption>Final cover. The dark frame and cool blues keep the mood quiet, while the orange and teal flares give the eye one place to land. The title sits low in a plain, condensed typeface so it stays readable over the grain.</figcaption></figure>
